[project]
name = "genaianalysis"
version = "0.2.0"
description = "Lab and toolbox for turning human data (chats, surveys, tickets, media) into structured, evaluated results with LLMs and other generative models."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AGE90", email = "alejandrogomezechavarria@gmail.com" }]
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pydantic-ai-slim[google,anthropic,openai]>=2.0",
    "pyprojroot>=0.3",
    "python-dotenv>=1.0",
    "scikit-learn>=1.9.1",
    "typesafe-sdk>=0.7.2",
]

[dependency-groups]
dev = [
    "ipykernel",
    "matplotlib>=3.11.2",
    "mypy",
    "nbconvert>=7.17.1",
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
extend-exclude = ["src/genaianalysis/generate/to_migrate.py"] # legacy dump, ported in Phase 1

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
per-file-ignores = { "tests/*" = ["E501"], "*.ipynb" = ["E501", "E703", "F704"] }  # top-level await is fine in Jupyter

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
mypy_path = "src"
exclude = ["to_migrate\\.py$"]
check_untyped_defs = true
disallow_any_generics = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
no_implicit_reexport = true
